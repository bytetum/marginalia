[package]
name = "marginalia"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dom_smoothie = "0.18.2"
hex = "0.4.3"
htmd = "0.5.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2"] }
rmcp = { version = "3.7.0", features = ["server", "transport-streamable-http-server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
surrealdb = { version = "3.3.4", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "net", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
uuid = { version = "1.29.0", features = ["v4"] }

# The static musl release build swaps musl's slow malloc for SurrealDB's own global allocator (jemalloc on x86_64).
# Scoped to musl so glibc and Nix builds are unchanged.
[target.'cfg(target_env = "musl")'.dependencies]
surrealdb = { version = "3.3.4", default-features = false, features = ["kv-surrealkv", "kv-mem", "allocator"] }

[dev-dependencies]
# in-process MCP client for tests/api.rs
rmcp = { version = "3.7.0", features = ["client"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
